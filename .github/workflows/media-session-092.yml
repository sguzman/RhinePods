name: RhinePods — PinePods 0.9.2 compatibility build

# Build-only experiment for the current metadata fix.
# The user's running Docker image, PostgreSQL and Valkey remain unchanged.
on:
  push:
    branches:
      - feature/media-session-metadata
      - fix/media-artwork-artist
    paths:
      - "compat/**"
      - "web/tests/media_session_metadata.mjs"
      - ".github/workflows/media-session-092.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinepods-092-web:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out RhinePods patch and test
        uses: actions/checkout@v4

      - name: Check out official PinePods 0.9.2 (not latest main)
        uses: actions/checkout@v4
        with:
          repository: madeofpendletonwool/PinePods
          ref: 0.9.2
          path: pinepods-092
          persist-credentials: false

      - name: Verify tag, apply patch and copy regression test
        run: |
          set -euo pipefail
          expected="caed39613b6218161c9d11966aa63a1a94f63750"
          actual="$(git -C pinepods-092 rev-parse HEAD)"
          test "$actual" = "$expected" || { echo "Unexpected PinePods 0.9.2 source SHA: $actual"; exit 1; }
          git -C pinepods-092 apply --check "$GITHUB_WORKSPACE/compat/metadata-0.9.2.patch"
          git -C pinepods-092 apply "$GITHUB_WORKSPACE/compat/metadata-0.9.2.patch"
          git -C pinepods-092 diff --check
          mkdir -p pinepods-092/web/tests
          cp web/tests/media_session_metadata.mjs pinepods-092/web/tests/media_session_metadata.mjs

      - name: Test exact metadata helper against 0.9.2 source (no npm)
        run: node pinepods-092/web/tests/media_session_metadata.mjs

      - name: Install Rust 1.99 and WASM target on GitHub runner
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version

      - name: Install upstream-compatible Trunk 0.21.14 on GitHub runner
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error "$url" --output /tmp/trunk.tar.gz
          curl --fail --location --silent --show-error "$url.sha256" --output /tmp/trunk.tar.gz.sha256
          printf '%s  %s\n' "$(cat /tmp/trunk.tar.gz.sha256)" "/tmp/trunk.tar.gz" | sha256sum --check -
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trunk" --version

      - name: Compile the patched 0.9.2 web frontend only
        working-directory: pinepods-092/web
        env:
          RUSTFLAGS: '--cfg=web_sys_unstable_apis --cfg getrandom_backend="wasm_js"'
        run: trunk build --features server_build --release

      - name: Measure and package frontend; no Docker image
        run: |
          set -euo pipefail
          du -sh pinepods-092/web/dist
          tar -czf rhinepods-web-pinepods-0.9.2.tar.gz -C pinepods-092/web/dist .
          stat -c 'Compressed compatible frontend: %s bytes' rhinepods-web-pinepods-0.9.2.tar.gz
          sha256sum rhinepods-web-pinepods-0.9.2.tar.gz

      - name: Save compatibility frontend as optional download (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: rhinepods-web-pinepods-0.9.2-metadata
          path: rhinepods-web-pinepods-0.9.2.tar.gz
          if-no-files-found: error
          retention-days: 7
